# ============================================================================
#  PUBLIER LINUX + WINDOWS + WEB (SANS ARTÉFACTS)
#  .github/workflows/publier-bureau-et-web.yml
# ============================================================================
#
#  POURQUOI CE WORKFLOW
#  --------------------
#  Les workflows `build-release.yml` et `build-web.yml` compilent PARFAITEMENT
#  (Linux, Windows, Web : toutes les compilations réussissent) mais échouent à
#  la toute dernière étape :
#
#      ##[error]Failed to CreateArtifact: Artifact storage quota has been hit.
#
#  Le quota de stockage d'« artéfacts » est saturé au niveau du COMPTE GitHub
#  (artéfacts + journaux de tous les dépôts), et il n'est jamais réellement
#  libéré — baisser la rétention ne s'applique qu'aux nouvelles exécutions.
#
#  Ce workflow n'utilise AUCUN artéfact : il téléverse les paquets
#  DIRECTEMENT comme fichiers de la release GitHub. C'est exactement ce que
#  fait `apk-immediat.yml`, qui a réussi. Avantages :
#    • plus aucune dépendance au quota d'artéfacts ;
#    • les fichiers restent attachés à la release (pas d'expiration à 30 j).
#
#  L'APK n'est PAS reconstruit ici : `apk-immediat.yml` s'en charge déjà, avec
#  la clé de signature officielle (il ne faut pas risquer un APK non signé).
#
#  UTILISATION
#  -----------
#  Actions → « Publier Linux + Windows + Web (sans artéfacts) » → Run workflow
#  (laisser le tag par défaut, ou indiquer un autre tag `v…` existant).
# ============================================================================
name: Publier Linux + Windows + Web (sans artéfacts)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag de la release (ex. v2.4.0)'
        required: false
        default: 'v2.4.0'

permissions:
  contents: write

env:
  FLUTTER_CHANNEL: stable

jobs:
  # ---------------------------------------------------------------------------
  # 1. La release doit exister avant d'y déposer les fichiers.
  # ---------------------------------------------------------------------------
  preparer:
    runs-on: ubuntu-latest
    steps:
      - name: Vérification
        run: |
          echo "Tag ciblé : ${{ inputs.tag }}"
          echo "La release est créée (ou actualisée) automatiquement par l'étape"
          echo "de publication de chaque job — aucune commande gh n'est utilisée."
          git --version

  # ---------------------------------------------------------------------------
  # 2. LINUX — archive .tar.gz
  # ---------------------------------------------------------------------------
  linux:
    needs: preparer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Dépendances système (GTK, GStreamer, SQLite)
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev pkg-config \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            libsqlite3-dev libblkid-dev liblzma-dev

      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Compiler (release)
        run: |
          flutter config --enable-linux-desktop
          flutter pub get
          CMAKE_BUILD_PARALLEL_LEVEL=2 flutter build linux --release

      - name: Empaqueter
        run: |
          set -euo pipefail
          cd build/linux/x64/release/bundle
          tar czf "$GITHUB_WORKSPACE/biashara-yangu-${{ inputs.tag }}-linux-x64.tar.gz" .

      - name: Publier sur la release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: Biashara Yangu ${{ inputs.tag }}
          files: biashara-yangu-${{ inputs.tag }}-linux-x64.tar.gz
          fail_on_unmatched_files: true

  # ---------------------------------------------------------------------------
  # 3. WINDOWS — archive .zip
  # ---------------------------------------------------------------------------
  windows:
    needs: preparer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Compiler (release)
        run: |
          flutter config --enable-windows-desktop
          flutter pub get
          flutter build windows --release

      - name: Empaqueter
        shell: pwsh
        run: |
          $dest = "biashara-yangu-${{ inputs.tag }}-windows-x64.zip"
          Compress-Archive -Path "build\windows\x64\runner\Release\*" -DestinationPath $dest -Force
          Get-Item $dest | Select-Object Name, Length

      - name: Publier sur la release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          files: biashara-yangu-${{ inputs.tag }}-windows-x64.zip
          fail_on_unmatched_files: true

  # ---------------------------------------------------------------------------
  # 4. WEB — archive .zip (publiée comme fichier de release)
  # ---------------------------------------------------------------------------
  #  On n'utilise PAS `actions/deploy-pages` : cette action passe elle aussi
  #  par le stockage d'artéfacts, donc par le même quota saturé.
  web:
    needs: preparer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Compiler (release)
        run: |
          flutter pub get
          flutter build web --release --base-href "/biasharayanguApp/"

      - name: Empaqueter
        run: |
          set -euo pipefail
          cd build/web
          zip -r "$GITHUB_WORKSPACE/biashara-yangu-${{ inputs.tag }}-web.zip" .

      - name: Publier sur la release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          files: biashara-yangu-${{ inputs.tag }}-web.zip
          fail_on_unmatched_files: true

  # ---------------------------------------------------------------------------
  # 5. Récapitulatif — ce qui est réellement disponible au téléchargement.
  # ---------------------------------------------------------------------------
  recap:
    needs: [linux, windows, web]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Lister les fichiers de la release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "=== Fichiers publiés pour ${{ inputs.tag }} ==="
          gh release view "${{ inputs.tag }}" --repo "$GITHUB_REPOSITORY" \
            --json assets --jq '.assets[] | "  \(.name) — \(.size / 1048576 | floor) Mo"'
