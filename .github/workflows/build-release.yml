# ============================================================================
#  PUBLICATION DE L'APPLICATION — APK + Linux + Windows (MODULE 12)
#
#  POURQUOI CE WORKFLOW
#    La machine de développement est trop lente pour compiler l'application.
#    GitHub compile à ta place (serveurs gratuits) et publie les TROIS paquets
#    prêts à installer dans l'onglet « Releases » du dépôt.
#
#  COMMENT LANCER UNE PUBLICATION
#    1. automatique — pousser un tag de version :
#         git tag v1.0.1
#         git push origin v1.0.1
#    2. manuel — GitHub → onglet « Actions » → « Publier l'application
#       (APK + Linux + Windows) » → bouton « Run workflow ».
#       (le champ tag peut rester vide : un nom de build de test est généré)
#
#  OÙ RÉCUPÉRER LES FICHIERS
#    1. github.com/Andre-luk/biasharayanguApp/releases → dernier release :
#         • biashara-yangu.apk           (téléphone Android)
#         • biashara-yangu-linux.tar.gz  (ordinateur Linux)
#         • biashara-yangu-windows.zip   (ordinateur Windows)
#    2. ou onglet « Actions » → le run → section « Artifacts »
#       (conservés 30 jours, parfait pour un simple test).
#
#  SIGNATURE ANDROID
#    • Sans secrets configurés, l'APK release est signé avec la clé DEBUG :
#      il s'installe et fonctionne, mais ne pourra pas remplacer un APK déjà
#      distribué avec une autre signature.
#    • Pour signer officiellement : voir docs/publication_app.md (§ keystore),
#      puis cloner ce fichier en version « avec keystore » si tu ajoutes les
#      secrets — la structure est prévue pour (étape commentée en bas).
# ============================================================================

name: Publier l'application (APK + Linux + Windows)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag de version (ex. v1.0.1) — laisser vide pour un build de test'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  # ==========================================================================
  #  ÉTAPE 1 — LA QUALITÉ D'ABORD : analyse + tous les tests.
  #  Si le code ne passe pas, rien n'est publié.
  # ==========================================================================
  qualite:
    name: Analyse & tests
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          cache: true

      - name: Récupérer les dépendances
        run: flutter pub get

      - name: Analyse statique
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Tests
        run: flutter test

  # ==========================================================================
  #  ÉTAPE 2a — APK Android (release).
  # ==========================================================================
  apk:
    name: APK Android
    needs: qualite
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Installer Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          cache: true

      - name: Récupérer les dépendances
        run: flutter pub get

      # 🔐 SIGNATURE OFFICIELLE (APKPure) — conditionnelle :
      #  • si les secrets GitHub sont configurés, l'APK est signé avec la clé
      #    release PERMANENTE → les mises à jour s'installent par-dessus les
      #    versions précédentes (exigence APKPure / Android) ;
      #  • sinon, repli sur la clé debug : la compilation ne casse jamais.
      # Secrets attendus (Settings → Secrets and variables → Actions) :
      #   ANDROID_KEYSTORE_BASE64  (base64 -w0 du fichier .jks)
      #   ANDROID_STORE_PASSWORD   ANDROID_KEY_PASSWORD   ANDROID_KEY_ALIAS
      # Mise en place : docs/publication_app.md (§ 7).
      - name: Restaurer le keystore release (si configuré)
        shell: bash
        env:
          B64_PRINCIPAL: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          B64_ALT: ${{ secrets.ANDROID_KEYSTOR_BIASHARA_YANGU }}
          STORE_PWD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_PWD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          B64="$B64_PRINCIPAL"
          if [ -z "$B64" ]; then B64="$B64_ALT"; fi

          if [ -z "$B64" ]; then
            echo "ℹ️ Aucun keystore configuré : repli sur la clé debug (APK NON signé officiellement)."
            echo "   Pour signer : créez ANDROID_KEYSTORE_BASE64, ANDROID_STORE_PASSWORD, ANDROID_KEY_PASSWORD, ANDROID_KEY_ALIAS."
            exit 0
          fi

          # Décodage + contrôle sommaire (un keystore réel fait > 1 Ko).
          printf '%s' "$B64" | base64 -d > android/upload-keystore.jks 2>/dev/null || true
          TAILLE=$(wc -c < android/upload-keystore.jks 2>/dev/null || echo 0)
          if [ "$TAILLE" -lt 500 ]; then
            echo "❌ Le secret keystore ($TAILLE octets décodés) ne contient pas un fichier .jks en base64."
            echo "   Attendu : ANDROID_KEYSTORE_BASE64 = sortie de « base64 -w0 biashara-upload.jks »."
            exit 1
          fi

          if [ -z "$STORE_PWD" ] || [ -z "$KEY_PWD" ] || [ -z "$KEY_ALIAS" ]; then
            echo "❌ Keystore présent mais secrets incomplets : créez AUSSI ANDROID_STORE_PASSWORD,"
            echo "   ANDROID_KEY_PASSWORD et ANDROID_KEY_ALIAS (Settings → Secrets → Actions)."
            exit 1
          fi

          cat > android/key.properties <<EOF
          storePassword=$STORE_PWD
          keyPassword=$KEY_PWD
          keyAlias=$KEY_ALIAS
          storeFile=../upload-keystore.jks
          EOF
          echo "✅ Keystore release installé ($TAILLE octets) — l'APK sera signé officiellement."

      - name: Compiler l'APK release
        run: flutter build apk --release

      - name: Renommer l'APK
        run: cp build/app/outputs/flutter-apk/app-release.apk biashara-yangu.apk

      - name: Déterminer le tag de publication
        id: tag
        shell: bash
        run: |
          T="${{ github.event.inputs.tag }}"
          if [ -z "$T" ]; then T="${GITHUB_REF_NAME}"; fi
          if [ -z "$T" ] || [ "$T" = "main" ]; then T="biashara-build-${{ github.run_number }}"; fi
          echo "tag=$T" >> "$GITHUB_OUTPUT"

      # 🚫 AUCUN ARTEFACT : le quota de stockage d'artéfacts du compte GitHub est
      # saturé (« Failed to CreateArtifact: Artifact storage quota has been
      # hit »), ce qui faisait échouer la publication à la toute dernière étape
      # et empêchait la création de la release. Le paquet part donc DIRECTEMENT
      # sur la release du tag : plus de dépendance au quota, et le fichier reste
      # attaché définitivement (pas d'expiration à 30 jours).
      - name: Publier l'APK sur la release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Biashara Yangu ${{ steps.tag.outputs.tag }}
          generate_release_notes: true
          files: biashara-yangu.apk
          fail_on_unmatched_files: true

  # ==========================================================================
  #  ÉTAPE 2b — Linux (archive tar.gz de l'exécutable + ressources).
  # ==========================================================================
  linux:
    name: Linux
    needs: qualite
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer les dépendances Linux
        run: |
          sudo apt-get update
          # libgtk-3-dev : interface ; gstreamer : plugins audio
          # (audioplayers_linux exige gstreamer-1.0 à la compilation).
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev

      - name: Installer Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          cache: true

      - name: Récupérer les dépendances
        run: flutter pub get

      - name: Compiler le binaire Linux
        run: flutter build linux --release

      # 🐧 SQLite est EMBARQUÉE dans le paquet : la bibliothèque système
      # s'appelle `libsqlite3.so.0` (le lien `.so` n'existe pas sans le
      # paquet -dev) — les utilisateurs n'ont donc rien à installer.
      - name: Embarquer SQLite (paquet autonome)
        run: |
          SQLITE_LIB="$(ldconfig -p | awk '/libsqlite3\.so\.0 /{print $NF; exit}')"
          test -n "$SQLITE_LIB"
          echo "SQLite trouvée : $SQLITE_LIB"
          cp -L "$SQLITE_LIB" build/linux/x64/release/bundle/lib/libsqlite3.so
          ls -lh build/linux/x64/release/bundle/lib/libsqlite3.so

      - name: Créer l'archive
        run: tar -czf biashara-yangu-linux.tar.gz -C build/linux/x64/release/bundle .

      - name: Déterminer le tag de publication
        id: tag
        shell: bash
        run: |
          T="${{ github.event.inputs.tag }}"
          if [ -z "$T" ]; then T="${GITHUB_REF_NAME}"; fi
          if [ -z "$T" ] || [ "$T" = "main" ]; then T="biashara-build-${{ github.run_number }}"; fi
          echo "tag=$T" >> "$GITHUB_OUTPUT"

      - name: Publier le paquet Linux sur la release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          files: biashara-yangu-linux.tar.gz
          fail_on_unmatched_files: true

  # ==========================================================================
  #  ÉTAPE 2c — Windows (archive zip du dossier Release).
  # ==========================================================================
  windows:
    name: Windows
    needs: qualite
    runs-on: windows-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          cache: true

      - name: Récupérer les dépendances
        run: flutter pub get

      # Le nouveau Visual Studio des serveurs (VS 2026) refuse les en-têtes
      # <experimental/coroutine> utilisés par les greffons audio/biométrie —
      # ce define rétablit la compilation (message STL1011).
      - name: Compiler le binaire Windows
        run: flutter build windows --release
        env:
          CL: /D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS

      # 🪟 Même logique : sqlite3.dll voyage AVEC l'application.
      - name: Ajouter SQLite (DLL) au paquet
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://www.sqlite.org/2024/sqlite-dll-win-x64-3460100.zip" -OutFile sqlite.zip
          Expand-Archive -Path sqlite.zip -DestinationPath sqlite
          Copy-Item sqlite\sqlite3.dll build\windows\x64\runner\Release\
          dir build\windows\x64\runner\Release\sqlite3.dll

      # 🪟 RUNTIME VISUAL C++ (app-local) — indispensable : sans ces DLL,
      # l'application REFUSE de démarrer sur une machine qui n'a pas le
      # « Microsoft Visual C++ Redistributable » installé (erreur classique
      # « MSVCP140.dll introuvable »). En les plaçant à côté de l'exe, elles
      # sont chargées en priorité : installation sans droits admin, zéro
      # dépendance système.
      - name: Embarquer le runtime Visual C++
        shell: pwsh
        run: |
          $dlls = @('msvcp140.dll','msvcp140_1.dll','msvcp140_2.dll',
                    'vcruntime140.dll','vcruntime140_1.dll','concrt140.dll')
          foreach ($dll in $dlls) {
            $src = "C:\Windows\System32\$dll"
            if (Test-Path $src) {
              Copy-Item $src build\windows\x64\runner\Release\
              Write-Host "✓ $dll embarqué"
            } else {
              Write-Host "ℹ️  $dll absent du runner (ignoré)"
            }
          }
          Get-ChildItem build\windows\x64\runner\Release\*.dll | Select-Object Name, Length

      - name: Créer l'archive
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath biashara-yangu-windows.zip

      # 🪟 INSTALLEUR OFFICIEL (Inno Setup) : un vrai « setup.exe » (Suivant →
      # Suivant → Terminer) au lieu d'un dossier à extraire — c'est ce format
      # que les utilisateurs attendent sur Windows.
      - name: Installer Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Compiler l'installeur (setup.exe)
        shell: pwsh
        run: |
          $version = (Select-String -Path pubspec.yaml -Pattern '^version:\s*([0-9]+\.[0-9]+\.[0-9]+)').Matches.Groups[1].Value
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" windows\installer\biashara_setup.iss
          Copy-Item windows\installer\dist\biashara-yangu-setup.exe .
          dir biashara-yangu-setup.exe

      - name: Déterminer le tag de publication
        id: tag
        shell: pwsh
        run: |
          $t = "${{ github.event.inputs.tag }}"
          if (-not $t) { $t = "$env:GITHUB_REF_NAME" }
          if (-not $t -or $t -eq "main") { $t = "biashara-build-${{ github.run_number }}" }
          "tag=$t" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Publier les paquets Windows sur la release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          files: |
            biashara-yangu-windows.zip
            biashara-yangu-setup.exe
          fail_on_unmatched_files: true

  # ==========================================================================
  #  ÉTAPE 3 — RELEASE GITHUB : SUPPRIMÉE (fusionnée dans chaque job)
  # --------------------------------------------------------------------------
  #  Elle téléchargeait des ARTEFACTS, or le quota d'artéfacts du compte est
  #  saturé : les trois jobs échouaient donc au dépôt, le job « release »
  #  n'était jamais exécuté (needs non satisfaits) et AUCUNE release n'était
  #  créée. Désormais chacun dépose son paquet directement sur la release du
  #  tag (voir les étapes « Publier … sur la release » ci-dessus) : la release
  #  est créée par le premier job qui arrive, les suivants la complètent.
  # ==========================================================================

  # ==========================================================================
  #  SIGNATURE OFFICIELLE — désormais INTÉGRÉE au job « apk » (voir l'étape
  #  « Restaurer le keystore release (si configuré) » plus haut).
  # --------------------------------------------------------------------------
  #  Elle s'active automatiquement dès que ces secrets existent
  #  (Settings → Secrets and variables → Actions) :
  #    • ANDROID_KEYSTORE_BASE64  → le .jks encodé en base64 :
  #        base64 -w0 upload-keystore.jks
  #    • ANDROID_STORE_PASSWORD, ANDROID_KEY_PASSWORD, ANDROID_KEY_ALIAS
  #  Tant qu'ils sont absents : repli sur la clé debug (build jamais cassé).
  #  Procédure complète (keystore, APKPure, mises à jour) :
  #  docs/publication_app.md (§ 7).
  # ==========================================================================
  # ==========================================================================
