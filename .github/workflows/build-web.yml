# ============================================================================
#  PUBLICATION DE LA VERSION WEB — Flutter Web (PHASE F)
#
#  POURQUOI CE WORKFLOW
#    Le navigateur n'a ni SQLite local ni fichiers système : la compilation
#    web est donc validée ici (les shims conditionnels neutralisent dart:io).
#    GitHub compile à ta place et publie l'archive du site.
#
#  COMMENT LANCER
#    1. automatique — chaque push sur `main` (si lib/, web/ ou pubspec change)
#    2. manuel — Actions → « Publier le web (Flutter Web) » → Run workflow
#       (champ `release_tag` : ex. v2.0.0 pour joindre le zip au release)
#    3. un tag `v*` pousse aussi le zip dans le release correspondant.
#
#  OÙ RÉCUPÉRER LE SITE
#    1. onglet « Actions » → le run → « Artifacts » → biashara-yangu-web.zip
#    2. si joint à un release : page du release → biashara-yangu-web.zip
#       (décompresser puis servir le dossier avec n'importe quel hébergeur :
#        GitHub Pages, Netlify, Vercel, un simple dossier Apache…)
# ============================================================================

name: Publier le web (Flutter Web)

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'lib/**'
      - 'web/**'
      - 'pubspec.yaml'
      - 'l10n.yaml'
      - '.github/workflows/build-web.yml'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag de release à compléter (ex. v2.0.0) — laisser vide pour un simple test'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  # ==========================================================================
  #  ÉTAPE 1 — LA QUALITÉ D'ABORD : analyse + tous les tests (comme le desktop).
  # ==========================================================================
  qualite:
    name: Analyse & tests
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          cache: true

      - name: Récupérer les dépendances
        run: flutter pub get

      - name: Analyse statique
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Tests
        run: flutter test

  # ==========================================================================
  #  ÉTAPE 2 — COMPILATION WEB (release) + ARCHIVE ZIP.
  # ==========================================================================
  web:
    name: Compiler le web
    needs: qualite
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          cache: true

      - name: Récupérer les dépendances
        run: flutter pub get

      - name: Compiler le site (release)
        run: flutter build web --release

      - name: Empaqueter le site (zip)
        run: cd build/web && zip -r "$GITHUB_WORKSPACE/biashara-yangu-web.zip" .

      - name: Envoyer l'archive (artéfact 30 jours)
        uses: actions/upload-artifact@v4
        with:
          name: biashara-yangu-web
          path: biashara-yangu-web.zip
          retention-days: 30

      # --- Tag poussé (v*) : joindre le zip au release du tag -------------
      - name: Joindre au release (tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: biashara-yangu-web.zip

      # --- Lancement manuel avec release_tag : joindre au release visé ----
      - name: Joindre au release (manuel)
        if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          files: biashara-yangu-web.zip

  # ==========================================================================
  #  ÉTAPE 3 — BRANCHE `gh-pages` (GitHub Pages).
  #  Le site est copié automatiquement dans la branche `gh-pages` : il
  #  suffit d'activer Pages UNE SEULE FOIS (Settings → Pages → Source :
  #  « Deploy from a branch » → branche `gh-pages` → / (root)) pour que
  #  l'application soit en ligne sur
  #      https://andre-luk.github.io/biasharayanguApp/
  #  et mise à jour à chaque passage de ce workflow.
  # ==========================================================================
  pages:
    name: Publier sur la branche gh-pages
    needs: web
    runs-on: ubuntu-latest
    # ⚠️ SÉRIALISATION OBLIGATOIRE : un même push déclenche CE workflow DEUX
    # fois (une fois pour la branche `main`, une fois pour le tag `v*`). Les
    # deux exécutions poussaient alors EN MÊME TEMPS sur `gh-pages` : la
    # seconde était rejetée (« Updates were rejected because the remote
    # contains work that you do not have locally ») et faisait apparaître un
    # échec alors que le site était bien publié. Le groupe de concurrence
    # ci-dessous les met à la queue leu leu.
    concurrency:
      group: gh-pages-publication
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - name: Récupérer l'archive du site
        uses: actions/download-artifact@v4
        with:
          name: biashara-yangu-web
          path: site

      - name: Décompresser le site
        run: cd site && unzip -o biashara-yangu-web.zip && rm biashara-yangu-web.zip

      - name: Adapter le chemin GitHub Pages (/biasharayanguApp/)
        run: sed -i 's|<base href="/">|<base href="/biasharayanguApp/">|' site/index.html

      - name: Copier vers la branche gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          publish_branch: gh-pages
          commit_message: 'site web — ${{ github.sha }}'

  # ==========================================================================
  #  ÉTAPE 4 — METTRE NETLIFY À JOUR (facultatif, jamais bloquant).
  #
  #  Trois façons de faire, dans cet ordre de priorité :
  #
  #   1. DÉPLOIEMENT DIRECT (le plus sûr) — secrets
  #        NETLIFY_AUTH_TOKEN  (Netlify → User settings → Applications →
  #                             Personal access tokens)
  #        NETLIFY_SITE_ID     (Netlify → Site settings → General → Site ID)
  #      Le site compilé est envoyé tel quel (base « / »), sans passer par
  #      `gh-pages` : c'est la méthode qui colle au domaine Netlify.
  #
  #   2. BUILD HOOK — secret NETLIFY_BUILD_HOOK
  #      (Netlify → Site settings → Build & deploy → Build hooks → Add).
  #      Netlify reconstruit depuis le dépôt : ne fonctionne que si le site
  #      est lié au dépôt.
  #
  #   3. RIEN — Netlify lié à la branche `gh-pages` se met à jour tout seul.
  #
  #  ⚠️ Sans aucun secret, l'étape explique la situation et RÉUSSIT : elle ne
  #     casse jamais la publication du site.
  # ==========================================================================
  netlify:
    name: Mettre Netlify à jour (si configuré)
    needs: web
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le site compilé
        uses: actions/download-artifact@v4
        with:
          name: biashara-yangu-web
          path: site

      - name: Décompresser le site
        run: cd site && unzip -o biashara-yangu-web.zip && rm biashara-yangu-web.zip

      - name: Déployer sur Netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          HOOK: ${{ secrets.NETLIFY_BUILD_HOOK }}
        run: |
          # 1) Déploiement direct du site compilé (méthode recommandée).
          if [ -n "$NETLIFY_AUTH_TOKEN" ] && [ -n "$NETLIFY_SITE_ID" ]; then
            echo "→ Déploiement direct sur Netlify (site $NETLIFY_SITE_ID)…"
            npx --yes netlify-cli@17 deploy \
              --prod \
              --dir=site \
              --site "$NETLIFY_SITE_ID" \
              --auth "$NETLIFY_AUTH_TOKEN" \
              --message "Biashara Yangu — $GITHUB_SHA"
            echo "✅ Site Netlify mis à jour."
            exit 0
          fi

          # 2) Build hook : Netlify reconstruit depuis le dépôt.
          if [ -n "$HOOK" ]; then
            echo "→ Appel du build hook Netlify…"
            CODE=$(curl -s -o /tmp/netlify.out -w "%{http_code}" -X POST "$HOOK")
            echo "Réponse Netlify : HTTP $CODE"
            cat /tmp/netlify.out 2>/dev/null || true
            echo ""
            if [ "$CODE" -ge 400 ]; then
              echo "❌ Netlify a refusé le redéploiement (hook expiré ou site supprimé)."
              echo "   Régénérez le build hook puis mettez à jour le secret."
              exit 1
            fi
            echo "✅ Redéploiement Netlify demandé."
            exit 0
          fi

          # 3) Rien de configuré : on explique, sans échouer.
          echo "ℹ️  Aucun secret Netlify configuré : le site n'est pas poussé chez Netlify."
          echo "    • Si Netlify publie la branche gh-pages : rien à faire, il se met"
          echo "      à jour tout seul (le site y est déjà, version à jour)."
          echo "    • Sinon, deux options (voir docs/publication_app.md §10.1) :"
          echo "      - NETLIFY_AUTH_TOKEN + NETLIFY_SITE_ID (déploiement direct),"
          echo "      - ou NETLIFY_BUILD_HOOK (redéploiement à distance)."
