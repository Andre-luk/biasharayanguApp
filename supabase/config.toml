# ============================================================================
#  biashara_yangu — configuration Supabase pour la CLI (déploiement)
# ============================================================================
#  Ce fichier permet de déployer les Edge Functions en ligne de commande :
#
#     npx supabase functions deploy agent-ia --project-ref pqzcliibocndiyqbyddr
#
#  ⚠️ Il ne contient AUCUN secret (la référence de projet est publique : elle
#  figure déjà dans `lib/main.dart`). La clé DeepSeek vit dans les *Secrets* du
#  projet (Dashboard → Project Settings → Edge Functions → Secrets), jamais ici.
#
#  Raccourci : `tools/deploy_agent_ia.sh` (demande le jeton d'accès en caché).

project_id = "pqzcliibocndiyqbyddr"

# ---------------------------------------------------------------------------
#  Edge Functions
# ---------------------------------------------------------------------------
#  `verify_jwt = true` (défaut) : la fonction refuse tout appel sans JWT
#  utilisateur valide — c'est ce que fait l'application (elle envoie le jeton
#  de la session en cours).
[functions.agent-ia]
verify_jwt = true

# ---------------------------------------------------------------------------
#  Passerelle de paiement SerdiPay (migration 79)
# ---------------------------------------------------------------------------
#  ⚠️ `verify_jwt = false` est OBLIGATOIRE : le webhook SerdiPay arrive SANS
#  jeton Supabase (c'est un serveur tiers). La fonction vérifie elle-même :
#    • les routes /initier et /statut → JWT utilisateur (auth.getUser) ;
#    • la route /webhook → signature HMAC (secret SERDIPAY_WEBHOOK_SECRET).
#  Ne JAMAIS laisser cette fonction en verification JWT : SerdiPay recevrait
#  401 et aucun paiement ne serait jamais confirmé.
[functions.serdipay]
verify_jwt = false

# ---------------------------------------------------------------------------
#  API de service Biashara Group (module 21 quinquies)
# ---------------------------------------------------------------------------
#  Authentification par en-tête `x-bg-token` (secret BG_ADMIN_TOKEN), pas par
#  JWT : la vérification JWT de la passerelle doit donc être désactivée.
[functions.admin-agents]
verify_jwt = false

