# tinyproxy — proxy SORTANT à IP fixe pour les appels vers l'API SerdiPay
#
# Utilité : si SerdiPay whitelist l'IP de nos APPELS (Edge Function → leur
# API), tous nos appels doivent sortir par cette IP fixe.
#
# Installation :
#   sudo apt install -y tinyproxy
#   sudo cp tinyproxy.conf /etc/tinyproxy/tinyproxy.conf
#   sudo cp serdipay.filter /etc/tinyproxy/serdipay.filter
#   sudo systemctl restart tinyproxy
#
# ⚠️ Ne JAMAIS exposer ce port sur Internet (proxy ouvert = votre IP
# utilisée par des tiers, et blacklist immédiate). Le port reste fermé par
# ufw ; l'accès se fait par VPN ou liste blanche d'IP.

User tinyproxy
Group tinyproxy

Port 8888
# Écouter uniquement sur l'interface privée / le VPN, pas sur 0.0.0.0 public.
Listen 10.0.0.1
Timeout 600

# Liste blanche des CLIENTS autorisés (à adapter : sortie Supabase, VPN,
# adresse de l'Edge Function si elle est fixe).
Allow 10.0.0.0/24

# Aucune connexion en clair : SerdiPay est en HTTPS uniquement.
ConnectPort 443
ConnectPort 8443

# Interdit tout ce qui n'est pas explicitement filtré ci-dessous.
FilterDefaultDeny Yes
Filter "/etc/tinyproxy/serdipay.filter"

DisableViaHeader Yes
LogLevel Warning
Syslog On
