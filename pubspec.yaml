name: biashara_yangu
description: "A new Flutter project."
publish_to: 'none'

version: 1.1.8+10

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # UI & utilitaires
  cupertino_icons: ^1.0.8
  fl_chart: ^0.68.0
  intl: ^0.20.2

  # PDF & Impression
  pdf: ^3.10.4
  printing: ^5.11.1
  audioplayers: ^6.0.0 # Pour le son de clochette/caisse
  vibration: ^2.0.1    # Pour faire vibrer le téléphone

  # Stockage & Fichiers
  path_provider: ^2.1.3
  path: ^1.9.0
  sqflite: ^2.3.0
  sqlite3: ^2.4.0 # SQLite embarquée dans les paquets Linux/Windows
  google_fonts: ^6.1.0

  # Sessions & préférences
  shared_preferences: ^2.5.4

  # Gestion d’état
  provider: ^6.0.5

  # Sécurité & biométrie
  local_auth: ^2.1.8

  # Navigation
  go_router: ^14.2.7

  # Permissions & images
  image_picker: ^0.8.7+5
  permission_handler: ^12.0.1

  # Backend
  supabase_flutter: ^2.10.3

  # Liens externes (WhatsApp / support depuis subscription_expired_page.dart)
  # Était utilisé mais non déclaré : l'appel compilait grâce à la dépendance
  # transitive de supabase_flutter, ce qui est fragile.
  url_launcher: ^6.3.2

  # Localisation
  flutter_localizations:
    sdk: flutter
  crypto: ^3.0.2
  uuid: ^4.5.2
  sqflite_common_ffi: ^2.3.0+2
  window_manager: ^0.2.5
  qr_flutter: ^4.1.0
  qr: ^3.0.2
  mobile_scanner: ^7.4.2
  excel: ^4.0.6
  file_selector: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

  # Splashscreen natif professionnel
  flutter_native_splash: ^2.4.1

  # Icônes de l'app
  flutter_launcher_icons: "^0.13.1"

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/Biashara_app_off-.png"
  min_sdk_android: 21

flutter_native_splash:
  color: "#FFFFFF"         # couleur de fond du splash
  image: assets/Biashara_app_off-.png   # tu peux changer selon ton logo
  android: true
  ios: true
  fullscreen: true
  android_gravity: center

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/ # ✅ Assurez-vous que cette ligne est à deux espaces d'indentation de 'assets:'
    - assets/sounds/cash_register.mp3